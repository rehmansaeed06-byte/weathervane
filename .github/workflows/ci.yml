name: CI

# Run on every push to main, and on pull requests that target main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check weather.js
          node --check script.js

      - name: Check build files
        run: npm run check:build

      - name: Run unit tests
        run: npm test
        
      - name: Build Docker image
        run: docker build -t weathervane .
