<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search any city for its current weather and a 5-day forecast.">
  <meta name="theme-color" content="#C5CED6" id="theme-color">
  <title>Weathervane</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23F2C14E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="cloud">
  <main class="page">
    <header class="top">
      <h1 class="brand">Weathervane</h1>
      <div class="units" role="group" aria-label="Temperature unit">
        <button type="button" id="unit-c" aria-pressed="true">&deg;C</button>
        <button type="button" id="unit-f" aria-pressed="false">&deg;F</button>
      </div>
    </header>

    <form id="search-form" class="search" role="search" autocomplete="off">
      <label for="city-input" class="visually-hidden">City name</label>
      <input id="city-input" type="search" name="city" placeholder="Search for a city" required>
      <button type="submit">Search</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <nav id="matches" class="matches" aria-label="Other matching places" hidden>
      <p>Not the right place? Try one of these.</p>
      <ul id="matches-list"></ul>
    </nav>

    <p id="empty" class="empty">Search for a city to see its current weather and a 5-day forecast.</p>

    <section id="current" class="current" aria-labelledby="place" hidden>
      <h2 id="place" class="place"></h2>
      <p id="place-detail" class="place-detail"></p>

      <div class="reading">
        <p id="temp" class="temp"></p>
        <div class="reading-side">
          <p id="condition" class="condition"></p>
          <dl class="stats">
            <div>
              <dt>Feels like</dt>
              <dd id="feels"></dd>
            </div>
            <div>
              <dt>Humidity</dt>
              <dd id="humidity"></dd>
            </div>
            <div>
              <dt>Wind</dt>
              <dd id="wind"></dd>
            </div>
          </dl>
        </div>
      </div>
    </section>

    <section id="forecast" class="forecast-section" aria-labelledby="forecast-title" hidden>
      <h2 id="forecast-title" class="forecast-title">5-day forecast</h2>
      <ol id="forecast-list" class="forecast"></ol>
    </section>

    <noscript>
      <p class="empty">Weathervane needs JavaScript to load weather data. Turn it on in your browser settings and reload the page.</p>
    </noscript>

    <footer class="foot">
      <p>Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a></p>
    </footer>
  </main>

  <script src="weather.js"></script>
  <script src="script.js"></script>
</body>
</html>
